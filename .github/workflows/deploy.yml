name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.223.132.63
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/elidefire/app
            git pull origin main
            npm install --production
            pm2 restart elidefire-app
            echo "✅ Deploy thành công $(date)"
